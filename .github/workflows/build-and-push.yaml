name: Build and push the image

on:
  push:
    branches:
      - main
    paths-ignore: &ignored-paths
      - 'README.md'
      - 'renovate.json'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches:
      - main
    paths-ignore: *ignored-paths
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: LOCAL ACT ONLY - Set Platform
        id: platform
        run: |
          echo "current_platform=${RUNNER_OS,,}/${RUNNER_ARCH,,}" >> "${GITHUB_OUTPUT}"
        if: env.ACT == 'true'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        if: env.ACT != 'true' && github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.ACT != 'true' && github.event_name != 'pull_request'

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ steps.platform.outputs.current_platform || (github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64') }}
          pull: true
          push: ${{ env.ACT != 'true' && github.event_name != 'pull_request' }}
          tags: strathos/php-nginx-supervisord:latest
