name: Build and push the image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: LOCAL ACT ONLY - Set Platform
        id: platform
        run: |
          echo "current_platform=${RUNNER_OS,,}/${RUNNER_ARCH,,}" >> "${GITHUB_OUTPUT}"
        if: env.ACT == 'true'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        if: env.ACT != 'true' && github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: env.ACT != 'true' && github.event_name != 'pull_request'

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          platforms: ${{ steps.platform.outputs.current_platform || (github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64') }}
          pull: true
          push: ${{ env.ACT != 'true' && github.event_name != 'pull_request' }}
          tags: strathos/php-nginx-supervisord:latest
